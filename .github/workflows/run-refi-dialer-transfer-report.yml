name: Run refi dialer transfer report

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Contact start date (YYYY-MM-DD)"
        required: true
        default: "2026-01-01"
      end_date:
        description: "Optional contact end date (YYYY-MM-DD)"
        required: false
        default: ""
      query:
        description: "detail | summary | both"
        required: true
        default: "detail"
      execute:
        description: "Execute query after dry run (true/false)"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery

      - name: Dry run / execute refi dialer transfer SQL
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          ARGS=(
            python3 scripts/run_refi_dialer_transfer_in_bq.py
            --start-date "${{ github.event.inputs.start_date }}"
            --query "${{ github.event.inputs.query }}"
          )
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS+=(--end-date "${{ github.event.inputs.end_date }}")
          fi
          if [ "${{ github.event.inputs.execute }}" = "true" ]; then
            ARGS+=(--execute --output-csv dist/refi_dialer_agent_transfer_report.csv)
          fi
          "${ARGS[@]}"

      - name: Upload CSV artifact
        if: github.event.inputs.execute == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refi-dialer-transfer-report
          path: dist/refi_dialer_agent_transfer_report.csv
